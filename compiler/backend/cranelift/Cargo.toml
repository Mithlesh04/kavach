[package]
name = "kavach-backend-cranelift"
description = "Native code generation for Kavach with Cranelift"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
kavach-runtime-native = { path = "../../../runtime/native" }
kavach-kir = { path = "../../kir" }
cranelift-codegen = "0.125"
cranelift-frontend = "0.125"
cranelift-jit = "0.125"
cranelift-module = "0.125"
cranelift-native = "0.125"
cranelift-object = "0.125"
# Writes `.eh_frame` for `kavach build` (decision 0074): the version
# Cranelift itself uses.
gimli = { version = "0.32", default-features = false, features = ["write"] }

[target.'cfg(windows)'.dependencies]
# Finds the MSVC linker for `kavach build`.
cc = "1"

[lints]
workspace = true
