[package]
name = "kavach-runtime-native"
description = "The run-time library of native Kavach programs: heap values, printing, panics"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
# `rlib` for running in memory (`kavach run --native`), `staticlib` to link
# into executables (`kavach build`).
crate-type = ["rlib", "staticlib"]

[dependencies]
kavach-runtime-core = { path = "../core" }
kavach-runtime-net = { path = "../net" }
kavach-runtime-window = { path = "../window" }
kavach-runtime-input = { path = "../input" }
kavach-runtime-audio = { path = "../audio" }
kavach-runtime-watch = { path = "../watch" }
kavach-runtime-image = { path = "../image" }
kavach-runtime-font = { path = "../font" }
kavach-runtime-tracy = { path = "../tracy" }
kavach-runtime-dialog = { path = "../dialog" }
kavach-runtime-process = { path = "../process" }
kavach-runtime-matrix = { path = "../matrix" }
kavach-runtime-gpu = { path = "../gpu" }
kavach-kir = { path = "../../compiler/kir" }
# Tasks as stackful coroutines (decision 0048).
corosensei = "0.3"

# Ctrl+C and SIGTERM (decision 0063); files mapped by `fs.map` (spec 14.3).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console", "Win32_System_Diagnostics_Debug", "Win32_System_Kernel", "Win32_System_LibraryLoader", "Win32_Foundation", "Win32_System_Memory", "Win32_System_Threading", "Win32_Security"] }

[lints]
workspace = true
