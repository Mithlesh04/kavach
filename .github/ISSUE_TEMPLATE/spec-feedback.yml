name: Spec feedback
description: Something in the language spec is confusing, inconsistent or missing.
title: "Spec: "
body:
  - type: dropdown
    id: chapter
    attributes:
      label: Chapter
      options:
        - 1. Basics
        - 2. Types
        - 3. Functions
        - 4. Control flow
        - 5. Errors
        - 6. Memory
        - 7. Contracts
        - 8. Capabilities and agents
        - 9. Concurrency
        - 10. Modules and packages
        - 11. Testing
        - 12. Maintainability at scale
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is unclear or wrong?
      description: Quote the section number (e.g. 7.2) and the sentence or code.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: What would you suggest?
      description: A short Kavach code example helps most.
